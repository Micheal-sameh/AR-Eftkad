services:
  # Prebuilt php-fpm + nginx + pdo_mysql base image. Built once, then served from cache.
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: eftkad-php-base
    scale: 0  # build-only: `up` must never start a container from this service

  app:
    build:
      context: .
      target: app
      additional_contexts:
        eftkad-php-base: service:base
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:80"
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - eftkad
      - central_net

networks:
  eftkad:
    driver: bridge
  central_net:
    external: true
