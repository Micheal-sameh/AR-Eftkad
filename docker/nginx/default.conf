# The page routes (/login, /visits, /directory, /users) only return static Blade
# shells - all auth and data loading happens in the browser against /api - so the
# rendered HTML depends only on the URL and the locale. nginx caches it per
# (path, locale) and skips PHP entirely on a hit. The cache lives inside the
# container, so a redeploy (new asset hashes) starts it empty.
fastcgi_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:10m max_size=50m inactive=1h use_temp_path=off;

# Request path without the query string (the shells ignore it).
map $request_uri $req_path {
    ~^(?<p>[^?]*) $p;
    default       $request_uri;
}

# Mirrors App\Http\Middleware\SetLocale: the `lang` cookie wins, then the first
# Accept-Language tag, otherwise Arabic.
map "$cookie_lang|$http_accept_language" $page_lang {
    default ar;
    ~^ar    ar;
    ~^en    en;
    ~^\|en  en;
    ~^\|ar  ar;
}

# 0 = cacheable shell page. Everything else (API, webhook, ...) always hits PHP.
map $req_path $no_page_cache {
    default                              1;
    ~^/login/avarewase/logout-webhook    1;
    ~^/(login|visits|directory|users)(/|$) 0;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php index.html;

    client_max_body_size 20M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite output is content-hashed, so it can be cached forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_cache pages;
        fastcgi_cache_key "$scheme$host$req_path|$page_lang";
        fastcgi_cache_valid 200 30m;
        fastcgi_cache_bypass $no_page_cache;
        fastcgi_no_cache $no_page_cache;
        fastcgi_cache_lock on;
        # Laravel sends "no-cache, private" on every response; that must not stop caching here.
        fastcgi_ignore_headers Cache-Control Expires;
        add_header X-Page-Cache $upstream_cache_status always;

        # Security headers (repeated here because add_header in a location replaces inherited ones).
        # The pages use inline scripts/styles, hence 'unsafe-inline'; everything else is locked to self.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://auth.avarewase.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
